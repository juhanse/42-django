<!DOCTYPE html>
<html lang="fr">

<head>
	<meta charset="UTF-8">
	<title>Formulaire de contact</title>
	<script src="popup.js"></script>
	<style>
		body {
			font-family: Arial, sans-serif;
			margin: 20px;
		}

		div {
			margin-bottom: 10px;
		}

		label {
			display: inline-block;
			width: 120px;
		}
	</style>
</head>

<body>
	<h1>Informations de contact</h1>
	<form action="#" method="get">
		<div>
			<label for="firstname">Firstname :</label>
			<input type="text" id="firstname" name="firstname">
		</div>

		<div>
			<label for="name">Name :</label>
			<input type="text" id="name" name="name">
		</div>

		<div>
			<label for="age">Age :</label>
			<input type="number" id="age" name="age">
		</div>

		<div>
			<label for="phone">Phone :</label>
			<input type="tel" id="phone" name="phone">
		</div>

		<div>
			<label for="email">Email :</label>
			<input type="email" id="email" name="email">
		</div>

		<div>
			<label>Gender :</label>
			<input type="radio" id="gender_male" name="gender" value="Male">
			<label for="gender_male" style="width: auto;">Male</label>

			<input type="radio" id="gender_female" name="gender" value="Female">
			<label for="gender_female" style="width: auto;">Female</label>

			<input type="radio" id="gender_other" name="gender" value="Other">
			<label for="gender_other" style="width: auto;">Other</label>
		</div>

		<div>
			<input type="checkbox" id="student" name="student">
			<label for="student" style="width: auto;">Student at 42 ?</label>
		</div>

		<div>
			<button type="button" onclick="displayFormContents();">Soumettre</button>
		</div>
	</form>
</body>

</html>
